<script src='../../../assets/vue.min.js'></script>
<div class="hy-view visible" data-id="icons"><style>
    [v-cloak] {
        display: none;
    }


    #icons-list {
        display:flex;
        flex-wrap:wrap;
        justify-content: center;
        background-color:white;
    }
    .icon.tile {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        margin: 2.5px;
    }

    .icon.tile .icon.bg {
        /* width: 5em;
        height: 5em;
        display: block; */
        width: 6.5em;
        height: 4.5em;
        -webkit-mask-size: contain;
        -webkit-mask-position: center center;
        -webkit-mask-repeat: no-repeat;
        background: #333;
        vertical-align: middle;
        flex: 0 0 auto;
        margin-left: auto;
        margin-right: auto;
    }


</style>
<script>

    Homey.showLoadingOverlay();
    Homey.setTitle( Homey.__("pair.icons.title") );

    $('#hy-overlay-loading-message').html( Homey.__("pair.icons.loading") );

    Homey.emit('list_icons', null, function (err, result) {
        
        Homey.setTitle( 'finished' +result.length);

        new Vue({
            el: '#icon_list',
            data: {
                icons: result,
            },
            mounted() {
                Homey.hideLoadingOverlay();
            },
            methods: {
                setIcon(icon) {
                    Homey.emit('icon_picked', {'icon': icon}, function (err, result) {
                        if (err) {
                            console.log(err);
                            return;
                        }
                        Homey.nextView();
                    });
                }
            }
        });
    });

</script>

<ul id="icon_list">    
      <div v-for="(item, index) in icons" :key="index" v-on:click='setIcon(item)' class="icon tile">
        <label for="icon" class="icon-wrap">
          <div class="icon bg" v-bind:style="{WebkitMaskImage: 'url(/app/nl.qluster-it.devicecapabilities' + item.location + ')'}"></span>
        </label>
      </div>
</ul>
