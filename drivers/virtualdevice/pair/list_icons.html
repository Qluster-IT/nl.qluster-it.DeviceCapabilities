<script src='../../../assets/vue.min.js'></script>
<div class="hy-view visible" data-id="icons"><style>
    [v-cloak] {
        display: none;
    }


    #icons-list {
        display:flex;
        flex-wrap:wrap;
        justify-content: center;
        background-color:white;
    }
    .icon.tile {
        display: inline-block;
        height: 100%;
        align-items: center;
        justify-content: center;
        margin: 2.5px;
    }

    .icon.tile .icon.bg {
        width: 6.5em;
        height: 4.5em;
        -webkit-mask-size: contain;
        -webkit-mask-position: center center;
        -webkit-mask-repeat: no-repeat;
        background: #333;
        vertical-align: middle;
        flex: 0 0 auto;
        margin-left: auto;
        margin-right: auto;
    }
    .icon.tile .icon.id {
      text-align:center;
      font-size:20px;
      margin-top: 10px;

    }

    #preview-outerframe {
    display: none;
    width: 100%;
    margin-top: 20px;
    text-align: center;
    margin: 0 auto;
  }
  #preview-innerframe img {
    width: 125px;
    height: 125px;
    padding: 20px;
  }
  .category {
    margin-top:40px;
  }

</style>
<script>

    var imgBase64 = '';
    Homey.showLoadingOverlay();
    Homey.setTitle( Homey.__("pair.list_icons.title") );

    $('#hy-overlay-loading-message').html( Homey.__("pair.list_icons.loading") );

    Homey.emit('list_icons', null, function (err, result) {

      new Vue({
            el: '#icon_list',
            data: {
                iconCategories: result,
            },
            mounted() {
                Homey.hideLoadingOverlay();
            },
            methods: {
                setIcon(icon) {
                    Homey.emit('icon_picked', {'icon': icon}, function (err, result) {
                        if (err) {
                            console.log(err);
                            return;
                        }
                        Homey.nextView();
                    });
                }
            }
        });
    });

    $('#save-icon').click(function() {
    Homey.emit('icon_save', imgBase64)
      .then(result => {
        Homey.nextView();
      })
      .catch(error => {
        Homey.alert(error.message, 'error');
        Homey.done()
      });
  });

    
  function loadIcon(event) {
    const img = event.target.files[0];
    const preview = document.getElementById('preview');
    const reader = new FileReader();
    reader.readAsDataURL(img);
    reader.onload = () => {
          imgBase64 = reader.result;
          preview.src = imgBase64;
          if (imgBase64.length > 1048000) return Homey.alert(Homey.__("imagetolarge", "Image size is too large"), 'error');
          $("#preview-outerframe").show();
          $('#save-icon').prop('disabled', false);
          return;
    };
  }

</script>

<div>
    <span data-i18n="pair.list_icons.custom_device_icon">If you wish to use a custom icon for your device, you can to upload it here. The icon needs to be in .svg format.</span><br/>
    <div class="form-group" style="margin-top:10px;">
        <input id="custom-icon" type="file" accept=".svg" name="image" onchange="loadIcon(event)">
    </div>
    <div id="preview-outerframe" style="margin-top:10px;">
      <div id="preview-innerframe">
        <img id="preview" />
      </div>
    </div>
    <div class="form-group buttons" style="margin-top:10px;">
      <button id="save-icon" class="button" data-i18n="pair.buttons.save_use" disabled>Save & use</button>
    </div>  
</div>


<div style="margin-top:10px;">
  <span data-i18n="pair.list_icons.select_device_icon">Or select one from the list.</span><br/>

  <ul id="icon_list">
        <div v-for="(cat, index) in iconCategories" :key="index" class="category">
          <h1  class="category-title">{{cat.title}}</h1>
          <div v-for="(item, index2) in cat.icons" :key="index2" v-on:click='setIcon(item)' class="icon tile">
            <label for="icon" class="icon-wrap">
              <div class="icon bg" v-bind:style="{WebkitMaskImage: 'url(/app/nl.qluster-it.devicecapabilities/assets/icons/' + item.url + '.svg'}"></div>
              <div class="icon id">{{item.id}}</div>
            </label>
          </div>
        </div>
  </ul> 
</div>
